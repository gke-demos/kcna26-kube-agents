# Public exposure: https://kcna26.demo.gke.ninja behind IAP. Pattern from
# simian-agent's ui-iap-gateway. The certificate map, static IP and DNS are
# in terraform/console.tf; the OAuth client Secret (fleet-scope-oauth, key
# client_secret) is created by scripts/console.sh gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fleet-scope
  namespace: fleet-scope
  annotations:
    networking.gke.io/certmap: fleet-scope
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: fleet-scope-ip
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: kcna26.demo.gke.ninja
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      hostname: kcna26.demo.gke.ninja
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fleet-scope
  namespace: fleet-scope
spec:
  parentRefs:
    - name: fleet-scope
      sectionName: https
  hostnames:
    - kcna26.demo.gke.ninja
  rules:
    - backendRefs:
        - name: fleet-scope
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fleet-scope-redirect
  namespace: fleet-scope
spec:
  parentRefs:
    - name: fleet-scope
      sectionName: http
  hostnames:
    - kcna26.demo.gke.ninja
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: fleet-scope
  namespace: fleet-scope
spec:
  default:
    # Bounds how long the live WebSocket stays open before the page
    # reconnects (it does so on its own); GKE's default of 30s is too short.
    timeoutSec: 3600
    iap:
      enabled: true
      clientID: OAUTH_CLIENT_ID
      oauth2ClientSecret:
        name: fleet-scope-oauth
  targetRef:
    group: ""
    kind: Service
    name: fleet-scope
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: fleet-scope
  namespace: fleet-scope
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 8080
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: fleet-scope
